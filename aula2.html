<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
    <style>
        body {
            font-family: 'Open Sans', Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h3>Formulário</h3>
    <form.method="post" action="processar_formulario.php">
        <div>   
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome_aluno" required>
        </div>
        <div>
            <label for="typedate">Data de Nascimento:</label>
            <input type="date" id="typedate" name="data_nascimento_aluno">  
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email_aluno">
        </div> 
        <div>
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone_aluno" required>
        </div>

        <br>

        <div>
            <label for="textarea">Descrição:</label>
            <textarea id="textarea" name="descricao_aluno"></textarea>
        </div>
        <div>
            <label for="range">Selecione a quantidade:</label>
            <input type="range" id="range" name="tamanho_aluno" min="0" max="10" 
                oninput="valorSelecionado.value = this.value">
            <output id="valorSelecionado">0</output>
        </div>

        <br>

        <div>
            <label for="carro">Selecione o Carro:</label>
            <select id="carro" name="carro_aluno">
                <option value="volvo">Volvo</option>
                <option value="saab">Saab</option>
                <option value="mercedes">Mercedes</option>
                <option value="audi">Audi</option>
                <option value="nissan">Nissan</option>
                <option value="dodge">Dodge</option>
                <option value="chevrolet">GM</option>
                <option value="toyota">Toyota</option>
                <option value="fiat">Fiat</option>
                <option value="Wolkswagen">Wolkswagen</option>
            </select>
        </div>

        <br>

        <div>
            <label for="cor">Selecione a Cor:</label>
            <select id="cor" name="cor_carro">
                <option value="branco">Branco</option>
                <option value="preto">Preto</option>
                <option value="vermelho">Vermelho</option>
                <option value="azul">Azul</option>
                <option value="verde">Verde</option>
                <option value="prata">Prata</option>
                <option value="roxo">Roxo</option>
                <option value="laranja">Laranja</option>
                <option value="cinza">Cinza</option>
                <option value="prata">Prata</option>
            </select>
        </div>
        <div>
            <label for="file">Selecione o arquivo:</label>
            <input type="file" id="file" name="arquivo_aluno">  
        </div>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>

    </form>
</body>
</html>
